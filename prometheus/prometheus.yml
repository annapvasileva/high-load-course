global:
  scrape_interval: 3s
  scrape_timeout: 2s

scrape_configs:
  - job_name: 'bombardier-host-job'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:1234']
  - job_name: 'online-store-job'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8081']
